# nginx 站点配置（docker 版）
# 部署时占位符会被替换：__AGNES_TOKEN__ → PROXY_ACCESS_TOKEN，__AUTH_COOKIE__ → AUTH_COOKIE。
#
# 门禁方式：cookie 校验，不是 Basic Auth。
# 原因：Basic Auth 协议上强制带用户名，做不到「只输密码」。
# 现在的流程是：访客打开任意页面 → 没 cookie → 跳 /login.html → 只填密码 →
# 代理校验通过 → 下发 canvas_auth=<随机串> 的 HttpOnly cookie → nginx 放行。
# 密码只存在服务端环境变量里，登录页拿不到，页面源码里也只有「通过/不通过」的结果。

# map 必须写在 server 之外（http 上下文）。
# AUTH_COOKIE 是 hex 串，不含正则元字符，可以安全地放进正则。
map $http_cookie $canvas_authed {
    default 0;
    "~*canvas_auth=__AUTH_COOKIE__" 1;
}

server {
    listen 80;
    server_name hb.cauai.fun;

    root /usr/share/nginx/canvas/current/dist;
    index index.html;

    # 站点在 Cloudflare 后面，CF 终止 SSL、nginx 收到的是 http。
    # 用相对重定向，让浏览器按当前页面的 https 去补全，避免被跳回 http。
    absolute_redirect off;

    # 登录页自身必须免门禁，否则用户永远进不来。
    # 它完全自包含（内联样式和脚本），不依赖 /assets，放行它不会漏任何资源。
    location = /login.html {
        add_header Cache-Control "no-store";
    }

    # 登录 / 登出端点：此刻访客还没有 cookie，必须放行，安全由密码兜底。
    location = /agnes/auth {
        proxy_pass http://agnes:8787/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /agnes/auth/logout {
        proxy_pass http://agnes:8787/auth/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 页面：没 cookie 就踢去登录页。
    location / {
        if ($canvas_authed = 0) {
            return 302 /login.html;
        }
        try_files $uri $uri/ /index.html;
    }

    # 静态资源：这里是程序化请求，302 到登录页没有意义，直接 403。
    location /assets/ {
        if ($canvas_authed = 0) {
            return 403;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 运行期配置，禁止缓存，同样要门禁
    location = /config.js {
        if ($canvas_authed = 0) {
            return 403;
        }
        add_header Cache-Control "no-store";
    }

    # Agnes 视频代理。
    # 接口是程序调用的，返回 302 会让前端拿到 HTML 却当 JSON 解析，所以直接 403。
    location /agnes/ {
        if ($canvas_authed = 0) {
            return 403;
        }

        # 令牌由 nginx 补上——浏览器不可能同时发两个 Authorization 头。
        proxy_set_header Authorization "Bearer __AGNES_TOKEN__";
        proxy_pass http://agnes:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成一次视频可能要等几分钟（Agnes 免费额度约 1 次/分钟）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 首尾帧模式要上传图片
        client_max_body_size 64m;
    }
}
