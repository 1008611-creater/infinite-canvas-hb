# nginx 站点配置（docker 版）
# 部署时会把 __AGNES_TOKEN__ 替换成真实的 PROXY_ACCESS_TOKEN。
# 路径都指向挂载进来的 /opt/infinite-canvas（容器内 /usr/share/nginx/canvas），
# current 是软链，切换版本后 nginx 每次请求重新解析，reload 即可生效。

server {
    listen 80;
    server_name hb.cauai.fun;

    root /usr/share/nginx/canvas/current/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文件名带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 运行期配置，禁止缓存
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Agnes 视频代理：浏览器调同域 /agnes/...，nginx 去掉前缀后转给 compose 里的 agnes 容器。
    # Basic Auth 挡住陌生访客；令牌由 nginx 补上——浏览器不可能同时发两个 Authorization 头。
    location /agnes/ {
        auth_basic "Infinite Canvas";
        auth_basic_user_file /usr/share/nginx/canvas/secrets/htpasswd;

        proxy_set_header Authorization "Bearer __AGNES_TOKEN__";
        proxy_pass http://agnes:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成一次视频可能要等几分钟（Agnes 免费额度约 1 次/分钟）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 首尾帧模式要上传图片
        client_max_body_size 64m;
    }
}
