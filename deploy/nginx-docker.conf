# nginx 站点配置（docker 版）
# 部署时占位符会被替换：__AGNES_TOKEN__ → PROXY_ACCESS_TOKEN，__AUTH_COOKIE__ → AUTH_COOKIE。
#
# 门禁方式：cookie 校验，不是 Basic Auth。
# 原因：Basic Auth 协议上强制带用户名，做不到「只输密码」。
# 现在的流程是：访客打开任意页面 → 没 cookie → 跳 /login.html → 只填密码 →
# 代理校验通过 → 下发 canvas_auth=<随机串> 的 HttpOnly cookie → nginx 放行。
# 密码只存在服务端环境变量里，登录页拿不到，页面源码里也只有「通过/不通过」的结果。

# map 必须写在 server 之外（http 上下文）。
# AUTH_COOKIE 是 hex 串，不含正则元字符，可以安全地放进正则。
map $http_cookie $canvas_authed {
    default 0;
    "~*canvas_auth=__AUTH_COOKIE__" 1;
}

server {
    listen 80;
    server_name hb.cauai.fun;

    root /usr/share/nginx/canvas/current/dist;
    index index.html;

    # 站点在 Cloudflare 后面，CF 终止 SSL、nginx 收到的是 http。
    # 用相对重定向，让浏览器按当前页面的 https 去补全，避免被跳回 http。
    absolute_redirect off;

    # 登录页自身必须免门禁，否则用户永远进不来。
    # 它完全自包含（内联样式和脚本），不依赖 /assets，放行它不会漏任何资源。
    location = /login.html {
        add_header Cache-Control "no-store";
    }

    # 登录 / 登出端点：此刻访客还没有 cookie，必须放行，安全由密码兜底。
    location = /agnes/auth {
        proxy_pass http://agnes:8787/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /agnes/auth/logout {
        proxy_pass http://agnes:8787/auth/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 页面：没 cookie 就踢去登录页。
    location / {
        if ($canvas_authed = 0) {
            return 302 /login.html;
        }
        try_files $uri $uri/ /index.html;
    }

    # 静态资源：这里是程序化请求，302 到登录页没有意义，直接 403。
    location /assets/ {
        if ($canvas_authed = 0) {
            return 403;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 运行期配置，禁止缓存，同样要门禁
    location = /config.js {
        if ($canvas_authed = 0) {
            return 403;
        }
        add_header Cache-Control "no-store";
    }

    # Agnes 视频代理。
    # 接口是程序调用的，返回 302 会让前端拿到 HTML 却当 JSON 解析，所以直接 403。
    location /agnes/ {
        if ($canvas_authed = 0) {
            return 403;
        }

        # 令牌由 nginx 补上——浏览器不可能同时发两个 Authorization 头。
        proxy_set_header Authorization "Bearer __AGNES_TOKEN__";
        proxy_pass http://agnes:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成一次视频可能要等几分钟（Agnes 免费额度约 1 次/分钟）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 首尾帧模式要上传图片
        client_max_body_size 64m;
    }

    # ---------------------------------------------------------------------------
    # 紫域（ziyuai.vip）中转：Key 由服务端注入，浏览器不持有真实 Key。
    # 本段由 implementation/scripts/apply-batch1.mjs 从
    # implementation/deploy/ziyu-nginx.conf.snippet 的第 27-63 行插入。
    # 批次 1 保留 cookie 门禁 —— /ziyu/ 会花真金白银，免门禁等于公开烧钱代理。
    # ---------------------------------------------------------------------------
    location /ziyu/ {
        # ★★★ 批次 1 必须保留站点门禁 ★★★
        #   这与 /api/、/dav/ 的既有做法不同，是有意为之：
        #   /ziyu/ 会花真金白银调用上游付费接口，一旦免门禁就是一台
        #   公开的烧钱代理。门禁取消只在批次 2 且必须与额度体系同时生效，
        #   详见本文件第四节。
        if ($canvas_authed = 0) {
            return 403;
        }

        # 服务端注入紫域 Key。浏览器发来的同名头会被这一行覆盖，
        # 所以前端填什么 apiKey 都不会影响安全性。
        # ⚠️ __ZIYU_KEY__ 必须由 publish.sh 在发布时替换，否则容器会把
        #    字面量 "Bearer __ZIYU_KEY__" 发给紫域 → 必然 401，且日志里
        #    看不出任何异常（发布日志仍然全绿）。见第三节。
        proxy_set_header Authorization "Bearer __ZIYU_KEY__";

        # 尾斜杠会剥掉 /ziyu 前缀再拼接：
        #   /ziyu/api/v1/jobs  →  https://<上游>/api/v1/jobs  ✅
        # 注意：这里写的是紫域根域名（不带 /api），因为紫域路径自带 /api/v1。
        proxy_pass https://ziyuai.vip/;

        proxy_http_version 1.1;
        proxy_set_header Host ziyuai.vip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务：紫域轮询 + 大素材上传都要留足时间。
        # Cloudflare 给源站的 100 秒上限仍在，超时表现为 524 —— 那是 CF 层的事，
        # 这里只是不让自己成为更早的那道瓶颈。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        client_max_body_size 64m;
    }

    # 画布服务端 API（账号 / 项目 / 素材 / 媒体文件）。
    #
    # 这里**刻意不吃** cookie 门禁：登录与注册接口本身必须在没有门禁的情况下可达，
    # 否则新用户永远进不来。安全由 API 自己保证 —— 除 /api/auth/* 与 /api/health 外，
    # 数据接口一律要求有效会话。
    #
    # proxy_pass 不带 URI，路径原样透传（/api/auth/login → api:8790/api/auth/login）。
    location /api/ {
        proxy_pass http://api:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 媒体上传：不设上限，边收边转。分片上传单请求只有 4MB，
        # 但整包上传（小文件）也要能过。
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 云端同步目录（WebDAV）：画布 / 我的素材 / 生成记录 / 本地媒体都由浏览器直连这里读写。
    #
    # 为什么不吃 cookie 门禁：
    #   门禁靠 canvas_auth cookie，而手机和电脑的原生 WebDAV 客户端（访达、资源管理器、
    #   文件 App）带不了站点的 cookie。这一层的安全由 Basic Auth 兜住，凭据与站点密码一致，
    #   所以「能进后台的人才能同步」，不会多开一个口子。
    location = /dav {
        return 301 /dav/;
    }

    location /dav/ {
        proxy_pass http://agnes:8789/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同步的是成片视频，动辄几十上百 MB：不设上限，且边收边转，
        # 否则 nginx 会先把整个文件落到自己的临时目录再转发（磁盘和内存双份开销）。
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        # 大文件上传/下载可能持续很久，别被默认 60s 掐断
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 作品展示位：免登录，供老大直接在浏览器看成片/分镜/文档。
    # 这个目录是手工建的，只存在于服务器上——不写回仓库的话，
    # 每次 publish 覆盖 default.conf 都会把它抹掉，所有交付链接当场失效。
    location ^~ /show/ {
        alias /usr/share/nginx/canvas/show/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
}
