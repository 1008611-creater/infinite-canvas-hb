name: Bug 报告
description: 报告可复现的问题
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出复现问题的操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写操作系统、浏览器、分支或提交号。
