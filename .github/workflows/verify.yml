name: 验证

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  web:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  video-proxy:
    name: 视频代理语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check agnes-video-proxy/server.js
